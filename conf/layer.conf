# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-glowworm"
BBFILE_PATTERN_meta-glowworm = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-glowworm = "7"

# meta-foundries provides the fioconfig recipe that this layer extends.
LAYERDEPENDS_meta-glowworm = "core meta-foundries"
# dev-access needs NetworkManager (meta-networking); the uno-q machine comes from meta-qcom-arduino.
LAYERRECOMMENDS_meta-glowworm = "networking-layer qcom-arduino"
LAYERSERIES_COMPAT_meta-glowworm = "blacksail"
